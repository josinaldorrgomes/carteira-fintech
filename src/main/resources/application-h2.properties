# ============================= PERFIL: h2 (PADRAO) =========================
# Banco em memoria: NAO precisa instalar nada (nem banco, nem Docker).
# Ideal para a primeira execucao e para testes rapidos.
#
# Atencao: os dados somem quando a aplicacao para (banco em memoria).
# ===========================================================================
spring.datasource.url=jdbc:h2:mem:carteira;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Para o H2, recriamos o schema a cada execucao (banco volatil).
spring.jpa.hibernate.ddl-auto=create-drop
