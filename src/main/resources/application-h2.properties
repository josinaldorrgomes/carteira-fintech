# Perfil "h2": roda o projeto SEM instalar PostgreSQL nem Docker.
# Use com:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
#
# O H2 e um banco em memoria: os dados somem quando a aplicacao para.
# Serve apenas para testar rapidamente.
spring.datasource.url=jdbc:h2:mem:carteira;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
