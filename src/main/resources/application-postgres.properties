# ============================= PERFIL: postgres ============================
# Use com:  DB_PROFILE=postgres  (ou spring.profiles.active=postgres)
#
# Pre-requisitos:
#   1. Ter um PostgreSQL rodando (local, docker-compose, ou remoto).
#   2. Ter criado o banco de dados (ver README -> "Banco de dados").
#   3. Informar os dados de conexao abaixo (ou por variavel de ambiente).
#
# Os defaults combinam com o docker-compose.yml deste projeto.
# ===========================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/carteira}
spring.datasource.username=${DB_USERNAME:carteira}
spring.datasource.password=${DB_PASSWORD:carteira}
spring.datasource.driver-class-name=org.postgresql.Driver
