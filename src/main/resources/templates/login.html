<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar · Carteira Fintech</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="login-wrap">
    <div class="login-card">
        <div class="brand">UNIEVANGÉLICA</div>
        <h1>Carteira Fintech</h1>
        <p style="color:var(--gray);margin-top:0">Projeto da Semana 11 · Interfaces em Java</p>

        <div class="alert" th:if="${param.logout}" style="border-left-color:var(--navy);background:#EAF0F7">
            Sessão encerrada com sucesso.
        </div>
        <div class="erro" th:if="${param.error}">
            Usuário ou senha inválidos.
        </div>

        <!-- O th:action gera o campo oculto com o token CSRF automaticamente. -->
        <form th:action="@{/login}" method="post">
            <label for="username">Usuário</label>
            <input type="text" id="username" name="username" autofocus required>

            <label for="password">Senha</label>
            <input type="password" id="password" name="password" required>

            <button class="btn" type="submit" style="width:100%">Entrar</button>
        </form>
    </div>
</div>
</body>
</html>
