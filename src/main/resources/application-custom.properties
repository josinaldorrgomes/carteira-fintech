# ============================= PERFIL: custom ==============================
# Conecte a QUALQUER outro SGBD (SQL Server, Oracle, etc.).
# Use com:  DB_PROFILE=custom  (ou spring.profiles.active=custom)
#
# Passos:
#   1. Adicione o driver JDBC do seu banco no pom.xml (ha um exemplo comentado la).
#   2. Crie o banco de dados no seu SGBD (ver README).
#   3. Preencha as 4 variaveis abaixo com os dados de conexao.
#      Pode preencher aqui direto OU por variavel de ambiente (DB_URL, etc.).
#
# Exemplo (SQL Server):
#   DB_URL=jdbc:sqlserver://localhost:1433;databaseName=carteira;encrypt=false
#   DB_DRIVER=com.microsoft.sqlserver.jdbc.SQLServerDriver
# ===========================================================================
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:}

# Normalmente o Hibernate descobre o "dialeto" sozinho pela conexao.
# Se precisar forcar, descomente e informe a classe do dialeto:
# spring.jpa.database-platform=${DB_DIALECT:}
