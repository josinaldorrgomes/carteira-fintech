spring.application.name=carteira-fintech

# ---------------------------------------------------------------------------
# Banco de dados: PostgreSQL (perfil padrao)
# Os valores vem de variaveis de ambiente; os defaults combinam com o docker-compose.yml.
# Boa pratica: segredos (senha) ficam FORA do codigo-fonte.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/carteira}
spring.datasource.username=${DB_USERNAME:carteira}
spring.datasource.password=${DB_PASSWORD:troque-esta-senha}

# Hibernate cria/atualiza as tabelas a partir das entidades (bom para aprender).
# Em producao, prefira migracoes versionadas (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------------------------------------------------------------------------
# Usuario inicial (apenas para desenvolvimento/demonstracao).
# A senha vem de variavel de ambiente e e guardada como HASH BCrypt.
# ---------------------------------------------------------------------------
app.admin.username=${ADMIN_USERNAME:aluno}
app.admin.password=${ADMIN_PASSWORD:senha123}
