spring.application.name=carteira-fintech

# ===========================================================================
#  ESCOLHA DO BANCO DE DADOS
# ===========================================================================
#  Troque UMA linha abaixo para escolher o banco. Opcoes prontas:
#     h2        -> banco em memoria, nao instala nada (PADRAO)
#     postgres  -> PostgreSQL
#     mysql     -> MySQL ou MariaDB
#     custom    -> qualquer outro SGBD (voce informa url/usuario/senha/driver)
#
#  Cada opcao tem um arquivo application-<opcao>.properties com os detalhes.
#  Tambem da para trocar sem editar este arquivo, por variavel de ambiente
#  (DB_PROFILE=postgres) ou na linha de comando
#  (./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres).
# ---------------------------------------------------------------------------
spring.profiles.active=${DB_PROFILE:h2}

# ===========================================================================
#  CONFIGURACOES COMUNS A TODOS OS BANCOS
# ===========================================================================
# O Hibernate cria/atualiza as tabelas a partir das entidades (bom para aprender).
# Em producao, prefira migracoes versionadas (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Usuario inicial (apenas para desenvolvimento/demonstracao).
# A senha vem de variavel de ambiente e e guardada como HASH BCrypt.
app.admin.username=${ADMIN_USERNAME:aluno}
app.admin.password=${ADMIN_PASSWORD:senha123}

# ===========================================================================
#  (OPCIONAL) CONEXAO DIRETA, SEM USAR PERFIL
# ===========================================================================
#  Se preferir NAO usar os perfis acima, troque spring.profiles.active por um
#  perfil vazio (ex.: DB_PROFILE=none) e preencha as 4 linhas abaixo com os
#  dados do seu banco. Lembre-se de ter o driver JDBC no pom.xml.
#
# spring.datasource.url=jdbc:seu-banco://host:porta/carteira
# spring.datasource.username=seu_usuario
# spring.datasource.password=sua_senha
# spring.datasource.driver-class-name=classe.do.Driver
