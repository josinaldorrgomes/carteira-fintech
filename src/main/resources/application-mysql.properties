# ============================= PERFIL: mysql ===============================
# Serve para MySQL e para MariaDB (os dois drivers ja estao no pom.xml).
# Use com:  DB_PROFILE=mysql  (ou spring.profiles.active=mysql)
#
# Pre-requisitos:
#   1. Ter um MySQL/MariaDB rodando.
#   2. Ter criado o banco de dados (ver README -> "Banco de dados").
#   3. Informar os dados de conexao abaixo (ou por variavel de ambiente).
# ===========================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/carteira}
spring.datasource.username=${DB_USERNAME:carteira}
spring.datasource.password=${DB_PASSWORD:carteira}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Para MariaDB, troque a URL para "jdbc:mariadb://localhost:3306/carteira"
# e o driver para "org.mariadb.jdbc.Driver".
